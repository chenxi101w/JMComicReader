<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}JM Reader · 漫画阅读器{% endblock %}</title>
  <script>
    /* 主题防闪烁：在首屏渲染前应用，避免 light→dark 跳变 */
    (function () {
      try {
        var t = localStorage.getItem('jm_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script>
  /* 渲染引擎自检：本程序依赖 CSS 自定义属性(var)/color-mix/flex 等现代特性，
     只能由 Edge WebView2(Chromium) 正确渲染。若系统缺少/损坏 WebView2 运行时，
     pywebview 会退回 IE(MSHTML) 内核，导致整页错乱。此脚本在 IE 下弹出明确修复指引，
     避免“界面莫名变样却毫无提示”。（刻意用 ES5 语法，保证 IE 也能执行本段） */
  (function () {
    function showEngineWarning() {
      try {
        var d = document.createElement('div');
        d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#0c0f17;color:#eef1f8;' +
          'font-family:Segoe UI,Microsoft YaHei,sans-serif;padding:40px;line-height:1.7;overflow:auto;');
        d.innerHTML = '<div style="max-width:680px;margin:0 auto">' +
          '<h1 style="color:#9b6bff;font-size:22px;margin:0 0 16px">⚠ 界面渲染引擎不可用</h1>' +
          '<p style="font-size:15px">本程序需要 <b>Microsoft Edge WebView2</b> 运行时才能正确显示界面，' +
          '但当前系统缺少或已损坏它，程序被迫退回老旧的 IE 内核，导致页面错乱（你看到的“界面变样”即由此引起）。</p>' +
          '<p style="font-size:15px"><b>解决办法（约 1 分钟）：</b></p>' +
          '<ol style="font-size:15px;padding-left:20px">' +
          '<li>打开 <span style="color:#6a7dff">https://developer.microsoft.com/zh-cn/microsoft-edge/webview2/</span></li>' +
          '<li>下载并运行 <b>Evergreen Bootstrapper</b>（常驻版安装器）</li>' +
          '<li>安装完成后<b>完全退出本程序并重新打开</b></li>' +
          '</ol>' +
          '<p style="font-size:13px;color:#9aa3b8">若已安装仍异常，可在“控制面板→程序”里修复/重装 WebView2 Runtime，' +
          '或在管理员 PowerShell 运行 <span style="color:#6a7dff">winget install Microsoft.EdgeWebView2.Runtime</span>。</p>' +
          '</div>';
        (document.body || document.documentElement).appendChild(d);
      } catch (e) {}
    }
    function engineSupported() {
      try {
        if (!window.CSS || !window.CSS.supports) return false;
        return window.CSS.supports('color', 'var(--x)');
      } catch (e) { return false; }
    }
    if (!engineSupported()) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', showEngineWarning);
      } else { showEngineWarning(); }
    }
  })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=66">
  <link rel="icon" id="appFavicon" href="{{ url_for('static', filename='img/icons/default.png') }}">
  <script>
    /* 应用图标防闪：首屏前按已有选择切换侧边栏 logo 与 favicon（无则默认） */
    (function () {
      try {
        var key = localStorage.getItem('jm_app_icon') || 'default';
        var png = '/static/img/icons/' + key + '.png';
        var fi = document.getElementById('appFavicon');
        if (fi) fi.setAttribute('href', png);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="app-desktop {% block body_mode %}{% endblock %}">
  <div class="app">
    <div class="d-shell">

      {# ── 内容区（无顶栏，内容直接铺满） ── #}
      <div class="d-content">
        <main class="app-main page-enter" id="appMain">
          {% block content %}{% endblock %}
        </main>
      </div>

      {# ── 底部导航（对齐手机版 v6.1.0：书架 / 发现 / 设置，共 3 Tab） ── #}
      <nav class="d-nav-bar" id="bottomNav" aria-label="主导航">
        {% set active = self.active_route() | default('') %}
        <a class="nav-item d-nav-item {% if active=='library' %}is-active{% endif %}" href="/library" data-route="library">
          <i class="fas fa-book-open"></i><span>书架</span>
        </a>
        <a class="nav-item d-nav-item {% if active=='search' %}is-active{% endif %}" href="/search" data-route="search">
          <i class="fas fa-compass"></i><span>发现</span>
        </a>
        <a class="nav-item d-nav-item {% if active=='settings' %}is-active{% endif %}" href="/settings" data-route="settings">
          <i class="fas fa-gear"></i><span>设置</span>
        </a>
      </nav>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <div id="modalRoot"></div>

  <script src="{{ url_for('static', filename='js/reader-logic.js') }}?v=66"></script>
  <script src="{{ url_for('static', filename='js/library-drag-logic.js') }}?v=66"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=66"></script>
  <script>
    // 新 UI 的小钩子：顶栏快捷跳转 & 主题按钮复用 app.js 中已有的 toggleTheme()
    (function () {
      document.querySelectorAll('[data-goto]').forEach(function (btn) {
        btn.addEventListener('click', function () { window.location.href = btn.getAttribute('data-goto'); });
      });
      var tBtn = document.getElementById('dThemeBtn');
      if (tBtn) {
        tBtn.addEventListener('click', function () {
          if (typeof window.toggleTheme === 'function') window.toggleTheme();
          else {
            var root = document.documentElement;
            var cur = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            var next = cur === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('jm_theme', next); } catch (e) {}
          }
          var ic = tBtn.querySelector('i');
          if (ic) ic.className = (document.documentElement.getAttribute('data-theme')==='dark' ? 'fas fa-sun' : 'fas fa-moon');
        });
        // 初始图标
        (function syncIcon(){
          var ic = tBtn.querySelector('i');
          if (ic) ic.className = (document.documentElement.getAttribute('data-theme')==='dark' ? 'fas fa-sun' : 'fas fa-moon');
        })();
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>

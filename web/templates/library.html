{% extends "base.html" %}
{% block subtitle %}本地书架{% endblock %}
{% block content %}

  <div class="library-layout">
    <aside class="library-side">
      <div class="library-side__head">
        <span class="section-title" style="margin:0">分类</span>
        <div style="display:flex;gap:6px">
          <button class="mini-btn" id="newCatBtn" title="新建分类"><i class="fas fa-folder-plus"></i></button>
          <button class="mini-btn" id="newSubBtn" title="在所选下新建子分类"><i class="fas fa-sitemap"></i></button>
        </div>
      </div>
      <div class="tree" id="catTree">
        <div class="tree-empty">加载中…</div>
      </div>
      <p class="lib-hint"><i class="fas fa-info-circle"></i> 点漫画左上角 <i class="fas fa-folder-plus"></i> 移入分类；点文件夹右侧 <i class="fas fa-arrows-up-down-left-right"></i> 调层级；也可拖拽</p>
    </aside>

    <section>
      <h3 class="section-title">
        <span id="currentCatName">全部漫画</span>
        <span class="count" id="currentCatCount"></span>
      </h3>
      <div class="comic-grid stagger" id="comicGrid"></div>
      <div class="empty" id="emptyState" style="display:none">
        <div class="empty__icon"><i class="fas fa-folder-open"></i></div>
        <h3>这个分类还是空的</h3>
        <p>去「搜索」下载漫画，或新建子分类整理</p>
      </div>
    </section>
  </div>

{% endblock %}
